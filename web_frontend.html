<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JAKE — AI Assistant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 6px;
      color: #ffffff;
    }

    header p {
      font-size: 0.85rem;
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Orb de voz */
    .orb-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }

    .orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1a3a5c, #0a0a1a);
      border: 2px solid #1e3a5f;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb::before {
      content: '';
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1px solid rgba(30, 90, 160, 0.3);
      animation: pulse-ring 2s ease-out infinite;
    }

    .orb.listening {
      background: radial-gradient(circle at 35% 35%, #0d3b6e, #051525);
      border-color: #2d6abf;
      box-shadow: 0 0 30px rgba(45, 106, 191, 0.5), 0 0 60px rgba(45, 106, 191, 0.2);
    }

    .orb.speaking {
      background: radial-gradient(circle at 35% 35%, #1a4a7a, #0a1e3a);
      border-color: #4a8fd4;
      box-shadow: 0 0 40px rgba(74, 143, 212, 0.6), 0 0 80px rgba(74, 143, 212, 0.3);
      animation: speaking-pulse 1s ease-in-out infinite;
    }

    .orb svg {
      width: 36px;
      height: 36px;
      fill: #4a8fd4;
      opacity: 0.8;
    }

    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    @keyframes speaking-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Status */
    .status-bar {
      text-align: center;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #3a6a9e;
    }

    .status-bar.connected { color: #2d6abf; }
    .status-bar.error { color: #9e3a3a; }

    /* Chat */
    .chat-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      height: 280px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-track { background: transparent; }
    .chat-box::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 4px; }

    .message {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .message .sender {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #3a6a9e;
    }

    .message.jake .sender { color: #4a8fd4; }
    .message.user .sender { color: #5a9e6a; }

    .message .text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #c8d8e8;
    }

    /* Controles */
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 12px 28px;
      border: 1px solid #1e3a5f;
      background: rgba(30, 58, 95, 0.3);
      color: #4a8fd4;
      border-radius: 8px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: rgba(45, 106, 191, 0.2);
      border-color: #2d6abf;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    button.danger {
      color: #9e3a3a;
      border-color: #5f1e1e;
    }

    button.danger:hover {
      background: rgba(191, 45, 45, 0.15);
      border-color: #9e3a3a;
    }

    /* Audio visualizer */
    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 30px;
    }

    .bar {
      width: 3px;
      background: #2d6abf;
      border-radius: 2px;
      transition: height 0.1s;
    }

    .empty-state {
      color: #333;
      text-align: center;
      font-size: 0.85rem;
      margin: auto;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>JAKE</h1>
      <p>Advanced AI Assistant</p>
    </header>

    <div class="orb-container">
      <div class="orb" id="orb" onclick="toggleListen()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
        </svg>
      </div>
    </div>

    <div class="visualizer" id="visualizer">
      <div class="bar" style="height:4px" id="b1"></div>
      <div class="bar" style="height:8px" id="b2"></div>
      <div class="bar" style="height:6px" id="b3"></div>
      <div class="bar" style="height:12px" id="b4"></div>
      <div class="bar" style="height:6px" id="b5"></div>
      <div class="bar" style="height:8px" id="b6"></div>
      <div class="bar" style="height:4px" id="b7"></div>
    </div>

    <div class="status-bar" id="status">— DISCONNECTED —</div>

    <div class="chat-box" id="chat">
      <div class="empty-state">Click the orb or press Connect to start</div>
    </div>

    <div class="controls">
      <button id="btnConnect" onclick="connect()">Connect</button>
      <button id="btnStop" onclick="stopJake()" disabled class="danger">Disconnect</button>
    </div>
  </div>

  <script>
    // ─── CONFIG ───────────────────────────────────────────────────────────────
    // Ao fazer deploy no Railway, o backend e o frontend estão no mesmo servidor.
    // A URL será detectada automaticamente.
    const BACKEND_URL = window.location.origin;

    // ─── STATE ────────────────────────────────────────────────────────────────
    let socket = null;
    let isConnected = false;
    let isListening = false;
    let isSpeaking = false;
    let mediaRecorder = null;
    let audioContext = null;
    let audioQueue = [];
    let isPlayingAudio = false;
    let animFrame = null;

    // ─── SOCKET.IO ────────────────────────────────────────────────────────────
    function connect() {
      if (socket && socket.connected) return;

      setStatus('Connecting...', '');
      socket = io(BACKEND_URL, { transports: ['websocket'] });

      socket.on('connect', () => {
        isConnected = true;
        setStatus('Connected — Ready', 'connected');
        document.getElementById('btnConnect').disabled = true;
        document.getElementById('btnStop').disabled = false;
        // Iniciar Jake automaticamente
        socket.emit('start_audio');
      });

      socket.on('disconnect', () => {
        isConnected = false;
        setStatus('Disconnected', 'error');
        stopMic();
        document.getElementById('btnConnect').disabled = false;
        document.getElementById('btnStop').disabled = true;
        setOrb('idle');
      });

      socket.on('status', (data) => {
        setStatus(data.msg, 'connected');
        if (data.msg.includes('Started') || data.msg.includes('Running')) {
          startMic();
        }
      });

      socket.on('transcription', (data) => {
        const sender = data.sender === 'JAKE' ? 'jake' : 'user';
        addMessage(sender, data.sender, data.text);
        if (sender === 'jake') {
          setOrb('speaking');
          isSpeaking = true;
        }
      });

      socket.on('audio_data', (data) => {
        // Recebe chunks de áudio do Jake e toca no browser
        playAudioChunk(new Uint8Array(data.data));
        setOrb('speaking');
      });

      socket.on('error', (data) => {
        setStatus('Error: ' + data.msg, 'error');
        addMessage('system', 'SYSTEM', '⚠️ ' + data.msg);
      });
    }

    function stopJake() {
      if (socket) {
        socket.emit('stop_audio');
        socket.disconnect();
        socket = null;
      }
      stopMic();
      isConnected = false;
      setStatus('Disconnected', '');
      setOrb('idle');
      document.getElementById('btnConnect').disabled = false;
      document.getElementById('btnStop').disabled = true;
    }

    // ─── MICROFONE ────────────────────────────────────────────────────────────
    async function startMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const source = audioContext.createMediaStreamSource(stream);
        const processor = audioContext.createScriptProcessor(1024, 1, 1);

        processor.onaudioprocess = (e) => {
          if (!isConnected || !socket) return;
          const float32 = e.inputBuffer.getChannelData(0);
          // Converter Float32 para Int16
          const int16 = new Int16Array(float32.length);
          for (let i = 0; i < float32.length; i++) {
            int16[i] = Math.max(-32768, Math.min(32767, float32[i] * 32768));
          }
          socket.emit('audio_input', { data: Array.from(int16) });
        };

        source.connect(processor);
        processor.connect(audioContext.destination);
        isListening = true;
        setOrb('listening');
        animateVisualizer();
      } catch (err) {
        setStatus('Mic access denied — please allow microphone', 'error');
      }
    }

    function stopMic() {
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
      isListening = false;
      cancelAnimationFrame(animFrame);
    }

    function toggleListen() {
      if (!isConnected) {
        connect();
      }
    }

    // ─── PLAYBACK DE ÁUDIO DO JAKE ────────────────────────────────────────────
    async function playAudioChunk(int16Data) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      const float32 = new Float32Array(int16Data.length);
      for (let i = 0; i < int16Data.length; i++) {
        float32[i] = int16Data[i] / 32768;
      }
      const buffer = ctx.createBuffer(1, float32.length, 24000);
      buffer.copyToChannel(float32, 0);
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      source.start();
    }

    // ─── UI HELPERS ───────────────────────────────────────────────────────────
    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = '— ' + msg.toUpperCase() + ' —';
      el.className = 'status-bar ' + (cls || '');
    }

    function setOrb(state) {
      const orb = document.getElementById('orb');
      orb.className = 'orb ' + state;
    }

    function addMessage(type, sender, text) {
      const chat = document.getElementById('chat');
      // Remover empty state
      const empty = chat.querySelector('.empty-state');
      if (empty) empty.remove();

      // Checar se deve atualizar a última mensagem (streaming)
      const last = chat.lastElementChild;
      if (last && last.dataset.sender === sender) {
        last.querySelector('.text').textContent += text;
      } else {
        const div = document.createElement('div');
        div.className = 'message ' + type;
        div.dataset.sender = sender;
        div.innerHTML = `<span class="sender">${sender}</span><span class="text">${text}</span>`;
        chat.appendChild(div);
      }
      chat.scrollTop = chat.scrollHeight;
    }

    function animateVisualizer() {
      const bars = ['b1','b2','b3','b4','b5','b6','b7'];
      function frame() {
        bars.forEach(id => {
          const h = isListening ? (4 + Math.random() * 20) : 4;
          document.getElementById(id).style.height = h + 'px';
        });
        animFrame = requestAnimationFrame(frame);
      }
      frame();
    }
  </script>
</body>
</html>
